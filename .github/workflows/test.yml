name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain, QEMU and OpenSBI
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf qemu-system-misc opensbi python3
          qemu-system-riscv64 --version
      - name: Build
        run: make kernel/kernel fs.img
      - name: Test
        run: make test
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
